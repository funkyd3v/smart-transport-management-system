services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: tms-app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - composer-cache:/tmp/composer-cache
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: tms
      DB_USERNAME: tms
      DB_PASSWORD: tms
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      BROADCAST_CONNECTION: reverb
      REVERB_HOST: reverb
      REVERB_PORT: "8080"
      REVERB_SCHEME: http
      COMPOSER_CACHE_DIR: /tmp/composer-cache
    command: >
      sh -lc "composer install --no-interaction --prefer-dist &&
      php artisan optimize:clear &&
      php-fpm"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - tms

  web:
    image: nginx:1.27-alpine
    container_name: tms-web
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - tms

  mysql:
    image: mysql:8.4
    container_name: tms-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: tms
      MYSQL_USER: tms
      MYSQL_PASSWORD: tms
      MYSQL_ROOT_PASSWORD: root
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - tms

  redis:
    image: redis:7-alpine
    container_name: tms-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - tms

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: tms-queue
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - composer-cache:/tmp/composer-cache
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: tms
      DB_USERNAME: tms
      DB_PASSWORD: tms
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      COMPOSER_CACHE_DIR: /tmp/composer-cache
    command: >
      sh -lc "composer install --no-interaction --prefer-dist &&
      php artisan queue:work --tries=1 --timeout=90"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - tms

  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: tms-reverb
    working_dir: /var/www/html
    ports:
      - "8080:8080"
    volumes:
      - ./:/var/www/html
      - composer-cache:/tmp/composer-cache
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: tms
      DB_USERNAME: tms
      DB_PASSWORD: tms
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      BROADCAST_CONNECTION: reverb
      REVERB_HOST: 0.0.0.0
      REVERB_PORT: "8080"
      REVERB_SCHEME: http
      COMPOSER_CACHE_DIR: /tmp/composer-cache
    command: >
      sh -lc "composer install --no-interaction --prefer-dist &&
      php artisan reverb:start --host=0.0.0.0 --port=8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - tms

  vite:
    image: node:20-alpine
    container_name: tms-vite
    working_dir: /var/www/html
    ports:
      - "5173:5173"
    volumes:
      - ./:/var/www/html
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - web
    networks:
      - tms

  mailpit:
    image: axllent/mailpit:latest
    container_name: tms-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - tms

networks:
  tms:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  composer-cache:

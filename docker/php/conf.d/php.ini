[PHP]
; Production settings for Laravel
upload_max_filesize = 32M
post_max_size = 32M
max_execution_time = 300
max_input_time = 300
memory_limit = 512M

; Error handling
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL

; Session configuration
session.gc_maxlifetime = 1440
session.save_path = "/var/lib/php/sessions"

; Timezone
date.timezone = UTC

; Performance
zend.enable_gc = On

; Security
expose_php = Off
